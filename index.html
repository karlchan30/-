<title>拳術指南</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: #f4f1ea; color: #222; }
  form { width: min(22rem, calc(100% - 2rem)); background: #fff; border-radius: 12px;

  input[type=password] { width: 100%; font-size: 1rem; padding: .65rem .7rem; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 1rem; }
  button { width: 100%; font-size: 1rem; padding: .7rem; border: 0; border-radius: 8px; background: #1c3d2e; color: #fff; }
  button:disabled { opacity: .6; }
  #err { display: none; color: #b00020; font-size: .9rem; margin: 0 0 .75rem; }
  #err.show { display: block; }
</style>
</head>

  function b64ToBytes(b64) {
    const bin = atob(b64);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const material = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
      material,
      { name: "AES-GCM", length: 256 },
      false,
      ["decrypt"]
    );
  }
  const form = document.getElementById("unlock");
  const pw = document.getElementById("pw");
  const err = document.getElementById("err");
  const btn = document.getElementById("openBtn");
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    err.classList.remove("show");
    btn.disabled = true;
    try {
      const salt = b64ToBytes(saltB64);
      const iv = b64ToBytes(ivB64);
      const cipher = b64ToBytes(ciphertextB64);
      const key = await deriveKey(pw.value, salt);
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, cipher);
      const html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    } catch (ex) {
      err.classList.add("show");
      btn.disabled = false;
      pw.focus();
      pw.select();
    }
  });
})();
